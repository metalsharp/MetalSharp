name: Bug Report
description: Report a bug or crash in MetalSharp
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please fill out the sections below.

  - type: input
    id: game
    attributes:
      label: Game or program
      description: Which game or Windows program were you running? Leave blank if the bug isn't tied to one.
      placeholder: e.g. Rain World, Portal 2, Battle.net, a standalone installer
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: MetalSharp Version
      description: Shown in Settings > About.
      placeholder: e.g. 1.6.0
    validations:
      required: true

  - type: dropdown
    id: build
    attributes:
      label: Build
      description: Which MetalSharp build are you running?
      options:
        - x86_64 (MetalSharp-arm64.dmg, Wine under Rosetta)
        - Arm64 FEX (MetalSharp-arm64-FEX.dmg)
        - Homebrew cask
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: library
    attributes:
      label: Library
      description: Where does the game or program come from?
      options:
        - Steam
        - GOG
        - Epic
        - Ubisoft Connect
        - Battle.net
        - Rockstar Games Launcher
        - Game Jolt
        - Windows Programs
        - Not game-specific
    validations:
      required: true

  - type: dropdown
    id: launch-method
    attributes:
      label: Graphics route
      description: The pipeline saved in the game's settings (Graphics tab).
      options:
        - Auto (MetalSharp's pick)
        - D3DMetal (x86_64 only)
        - Mullion (DXMT)
        - VKD3D-Proton
        - DXVK
        - VKD3D / DXVK (x86_64)
        - OpenGL (WineMetalGL)
        - OpenGL (Zink)
        - MetalVR
        - Not applicable
    validations:
      required: true

  - type: textarea
    id: settings
    attributes:
      label: Game settings changed
      description: Anything you changed from the defaults, e.g. msync, MetalFX, x87 acceleration, Vulkan renderer (MoltenVK / KosmicKrisp), ray tracing, Retina, environment variables, DLL overrides.
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug. What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Launch game via...
        2. Play until...
        3. Observe...
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: |
        Paste crash logs or MetalSharp backend logs.
        Log location: `~/.metalsharp/logs/`
        Crash reports: `~/Library/Logs/DiagnosticReports/metalsharp-backend*.ips`
      render: shell
    validations:
      required: false

  - type: input
    id: hardware
    attributes:
      label: Mac model / chip
      placeholder: e.g. MacBook Pro M4 Pro, Mac mini M2
    validations:
      required: false

  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: e.g. Tahoe 26.4, Sequoia 15.6
    validations:
      required: false

  - type: textarea
    id: external-drives
    attributes:
      label: External drive info
      description: If the game is installed on an external drive, what format and connection?
      placeholder: e.g. SSD via USB-C, APFS format, mounted at /Volumes/MySSD
    validations:
      required: false
