name: Feature Request
description: Suggest a feature or game compatibility improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Describe the feature or improvement you'd like to see.

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Game Compatibility
        - Graphics routes (D3DMetal, Mullion, VKD3D-Proton, DXVK, OpenGL)
        - MetalVR
        - Libraries (Steam, GOG, Epic, Ubisoft, Battle.net, Rockstar, Game Jolt)
        - Windows Programs
        - App / UI
        - C Backend
        - MetalSharp Wine / FEX runtime
        - Updates / Install (Sparkle, Homebrew)
        - Build / CI
        - Documentation
        - Other
    validations:
      required: true

  - type: dropdown
    id: build
    attributes:
      label: Build
      description: Which build does this apply to?
      options:
        - Both
        - x86_64
        - Arm64 FEX
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: What would you like to see?
      description: Describe the feature, improvement, or game support request.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, references, screenshots, or related issues.
    validations:
      required: false
