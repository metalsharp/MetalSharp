name: Game Compatibility Report
description: Report whether a game works or doesn't work with MetalSharp
labels: [compatibility]
body:
  - type: markdown
    attributes:
      value: |
        Tested games are listed in [Game Compatibility](https://github.com/metalsharp/MetalSharp/blob/main/docs/games-supported.md).

  - type: input
    id: game-name
    attributes:
      label: Game Name
    validations:
      required: true

  - type: dropdown
    id: library
    attributes:
      label: Library
      options:
        - Steam
        - GOG
        - Epic
        - Ubisoft Connect
        - Battle.net
        - Rockstar Games Launcher
        - Game Jolt
        - Windows Programs
    validations:
      required: true

  - type: input
    id: steam-appid
    attributes:
      label: Steam App ID
      description: For Steam games. Found in the Steam store URL, e.g. store.steampowered.com/app/312520
      placeholder: e.g. 312520
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: MetalSharp Version
      placeholder: e.g. 1.4.0
    validations:
      required: true

  - type: dropdown
    id: build
    attributes:
      label: Build
      options:
        - x86_64 (MetalSharp-arm64.dmg, Wine under Rosetta)
        - Arm64 FEX (MetalSharp-arm64-FEX.dmg)
    validations:
      required: true

  - type: dropdown
    id: status
    attributes:
      label: Status
      options:
        - Works perfectly
        - Works with minor issues
        - Partially works (describe issues)
        - Does not launch
        - Crashes during gameplay
    validations:
      required: true

  - type: dropdown
    id: launch-method
    attributes:
      label: Graphics route used
      options:
        - Auto (MetalSharp's pick)
        - D3DMetal (x86_64 only)
        - Mullion (DXMT)
        - VKD3D-Proton
        - DXVK
        - VKD3D / DXVK (x86_64)
        - OpenGL (WineMetalGL)
        - OpenGL (Zink)
        - MetalVR
    validations:
      required: true

  - type: input
    id: headset
    attributes:
      label: VR headset
      description: For MetalVR reports only.
      placeholder: e.g. Meta Quest 3, Valve Index
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: What works, what doesn't, any workarounds, settings you changed (msync, MetalFX, Retina, renderers), visual glitches, performance notes.
    validations:
      required: true

  - type: input
    id: hardware
    attributes:
      label: Mac model / chip
    validations:
      required: false

  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: e.g. Tahoe 26.4
    validations:
      required: false

  - type: input
    id: fps
    attributes:
      label: Approximate FPS
      placeholder: e.g. 60fps at 1080p, 30fps at 4K
    validations:
      required: false
