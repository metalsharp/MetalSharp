name: Copy signing secrets to WineMetalGL
on: workflow_dispatch
permissions: {}
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Copy the signing secrets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.WINEMETALGL_SECRETS_TOKEN }}
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo "WINEMETALGL_SECRETS_TOKEN is not available to this repository"; exit 1; }
          for name in MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            test -n "${!name}" || { echo "$name is empty in MetalSharp"; exit 1; }
            printf '%s' "${!name}" | gh secret set "$name" --repo metalsharp/WineMetalGL
            echo "copied $name"
          done
