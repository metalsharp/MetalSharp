name: VirusTotal Release Scan

on:
  workflow_run:
    workflows: ["Release CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Successful Release CI run ID whose exact artifact should be rescanned
        required: true
        type: string

concurrency:
  group: virustotal-release-${{ github.event.workflow_run.id || inputs.release_run_id || github.run_id }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  scan:
    name: Scan released DMG thirds
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Resolve successful Release CI run
        id: source
        run: |
          set -euo pipefail
          case "$REQUESTED_RUN_ID" in
            ''|*[!0-9]*) echo "Invalid Release CI run ID: $REQUESTED_RUN_ID" >&2; exit 1 ;;
          esac
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REQUESTED_RUN_ID" > release-run.json
          test "$(jq -r .name release-run.json)" = "Release CI"
          test "$(jq -r .event release-run.json)" = "push"
          test "$(jq -r .conclusion release-run.json)" = "success"
          head_sha="$(jq -r .head_sha release-run.json)"
          test -n "$head_sha"
          test "$head_sha" != "null"
          if [ -n "$REQUESTED_HEAD_SHA" ]; then
            test "$head_sha" = "$REQUESTED_HEAD_SHA"
          fi
          printf 'release_run_id=%s\n' "$REQUESTED_RUN_ID" >> "$GITHUB_OUTPUT"
          printf 'head_sha=%s\n' "$head_sha" >> "$GITHUB_OUTPUT"
          printf 'Validated successful Release CI run %s at %s\n' "$REQUESTED_RUN_ID" "$head_sha"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_RUN_ID: ${{ github.event.workflow_run.id || inputs.release_run_id }}
          REQUESTED_HEAD_SHA: ${{ github.event.workflow_run.head_sha || '' }}

      - name: Check out scanner revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || steps.source.outputs.head_sha }}

      - name: Download the exact Release CI artifact
        run: |
          set -euo pipefail
          mkdir -p release-artifact
          gh run download "$RELEASE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name MetalSharp-dmg \
            --dir release-artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_RUN_ID: ${{ steps.source.outputs.release_run_id }}

      - name: Validate release identity
        id: release
        run: |
          set -euo pipefail
          mapfile -t tag_files < <(find release-artifact -type f -name RELEASE-TAG.txt -print)
          test "${#tag_files[@]}" -eq 1
          tag="$(tr -d '\r\n' < "${tag_files[0]}")"
          case "$tag" in
            v[0-9]*) ;;
            *) echo "Invalid release tag in artifact: $tag" >&2; exit 1 ;;
          esac
          resolved_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)"
          test "$resolved_sha" = "$RELEASE_HEAD_SHA"
          gh release view "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets > published-release.json
          python3 tools/ci/virustotal-release.py validate-assets \
            --artifact-dir release-artifact \
            --assets-json published-release.json
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'Validated release %s at %s\n' "$tag" "$resolved_sha"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_HEAD_SHA: ${{ steps.source.outputs.head_sha }}

      - name: Split and scan every released DMG
        run: |
          python3 tools/ci/virustotal-release.py scan \
            --artifact-dir release-artifact \
            --tag "$RELEASE_TAG" \
            --part-dir virustotal-parts \
            --json-output virustotal-results.json \
            --markdown-output virustotal-results.md
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}

      - name: Add VirusTotal links to release notes
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json body \
            --jq .body > release-body.md
          python3 tools/ci/virustotal-release.py merge-body \
            --body release-body.md \
            --section virustotal-results.md \
            --output release-body-updated.md
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --notes-file release-body-updated.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}

      - name: Upload VirusTotal scan record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VirusTotal-results-${{ steps.source.outputs.release_run_id }}
          path: |
            virustotal-results.json
            virustotal-results.md
          if-no-files-found: warn
          retention-days: 90

      - name: Fail on malicious or suspicious detections
        run: |
          detections="$(jq '[.results[].stats | (.malicious // 0) + (.suspicious // 0)] | add // 0' virustotal-results.json)"
          if [ "$detections" -ne 0 ]; then
            echo "VirusTotal reported $detections malicious or suspicious detections." >&2
            exit 1
          fi
          echo "VirusTotal reported no malicious or suspicious detections."
