name: Tag release

# A version bump merged to main releases it: when CMakeLists.txt's version (tools/release/set-version.sh) has no
# v<version> tag yet, this tags the merged commit and starts Release CI on that tag. A tag pushed with the workflow's
# token starts no workflow of its own, so Release CI is started by workflow_dispatch on the tag, which it builds and
# names the release from (GITHUB_REF_NAME). A push that leaves the version alone, or one already tagged, does nothing.
on:
  push:
    branches: [main]
    paths: [CMakeLists.txt]

permissions:
  contents: write
  actions: write

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  tag:
    name: Tag the version and start Release CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(sed -n 's/^project(metalsharp VERSION \([0-9][0-9.]*\) .*/\1/p' CMakeLists.txt | head -1)"
          if [ -z "$version" ]; then
            echo "No version in CMakeLists.txt" >&2
            exit 1
          fi
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag exists already: nothing to release"
            exit 0
          fi
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
          gh workflow run release.yml --ref "$tag"
          echo "Tagged $GITHUB_SHA as $tag and started Release CI on it"
