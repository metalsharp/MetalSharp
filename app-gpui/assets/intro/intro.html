<!doctype html>
<!-- App.vue startup video overlay; MetalSharp reads #done from the URL. -->
<html>
<head>
<meta charset="utf-8">
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: #050607; }
.startup-video-overlay { position: fixed; inset: 0; display: grid; place-items: center; overflow: hidden; background: #050607; }
.startup-video { width: 100%; height: 100%; object-fit: contain; }
.startup-video-skip {
  position: absolute; right: 24px; bottom: 24px; padding: 9px 16px;
  border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 6px;
  color: #fff; background: rgba(0, 0, 0, 0.55); cursor: pointer;
  font: 13px -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif;
}
.startup-video-skip:hover { background: rgba(255, 255, 255, 0.15); }
</style>
</head>
<body>
<div class="startup-video-overlay" role="dialog" aria-label="MetalSharp introduction">
  <video class="startup-video" autoplay muted playsinline preload="auto"></video>
  <button class="startup-video-skip" type="button">Skip intro</button>
</div>
<script>
const video = document.querySelector("video");
const finish = () => { location.hash = "done"; };
video.addEventListener("ended", finish);
video.addEventListener("error", finish);
document.querySelector("button").addEventListener("click", finish);
const src = new URLSearchParams(location.search).get("src");
if (src) { video.src = src; } else { finish(); }
</script>
</body>
</html>
