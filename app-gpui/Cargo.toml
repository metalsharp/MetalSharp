[package]
name = "metalsharp-gpui"
version = "0.1.0"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"
description = "Native GPUI desktop app prototype for MetalSharp"

[dependencies]
anyhow = "1"
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3.4", default-features = false, features = ["json"] }
rfd = "0.15"
unicode-segmentation = "1"

[profile.release]
codegen-units = 1
