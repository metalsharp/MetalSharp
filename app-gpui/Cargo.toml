[package]
name = "metalsharp-gpui"
version = "0.77.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Native GPUI desktop app prototype for MetalSharp"

[features]
# Explicit local acceptance harness; never enabled in packaging/default builds.
browser-fixture = []

[dependencies]
anyhow = "1"
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3.4", default-features = false, features = ["json", "rustls", "gzip"] }
rfd = "0.15"
unicode-segmentation = "1"
url = "2"
libc = "0.2"
raw-window-handle = "0.6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
block2 = "=0.6.2"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSUUID", "NSURL", "NSValue"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSButton", "NSColor", "NSPasteboard", "NSResponder", "NSView", "NSGraphics", "NSLayoutAnchor", "NSLayoutConstraint", "NSStackView", "NSTextField", "NSUserInterfaceLayout", "NSWindow"] }
objc2-web-kit = { version = "=0.3.1", default-features = false, features = ["objc2-app-kit", "objc2-core-foundation", "WKContentRuleList", "WKContentRuleListStore", "WKDownload", "WKDownloadDelegate", "WKUserContentController", "WKFrameInfo", "WKNavigation", "WKNavigationAction", "WKNavigationDelegate", "WKNavigationResponse", "WKSecurityOrigin", "WKUIDelegate", "WKWebView", "WKWebViewConfiguration", "WKWebsiteDataStore", "WKWindowFeatures", "block2"] }

[dev-dependencies]
gpui = { version = "=0.2.2", features = ["test-support"] }
regex = "1"

[profile.release]
codegen-units = 1
